<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>Pizza United FC · L’equip dl poble</title>
<meta name="description" content="Archivo oficial de Pizza United FC: historia, temporadas, camisetas, jugadores y trofeos del club.">
<meta property="og:title" content="Pizza United FC · L’equip del poble">
<meta property="og:description" content="Historia, temporadas, camisetas, jugadores y trofeos del club.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
:root{--k:#000;--k2:#181818;--r:#E50914;--rd:#8F0710;--g:#272727;--m:#a0a0a0;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);background:#000;color:#fff;font:400 16px/1.5 'Manrope',system-ui,sans-serif}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;margin:0}
body{min-height:100vh;overflow-x:hidden;background:var(--k)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--k);z-index:25}
h1,h2,h3,.d{font-family:'Anton','Impact',sans-serif;font-weight:400;text-transform:uppercase;line-height:.95;letter-spacing:.01em}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--r);outline-offset:3px}
.btn{border:1px solid #fff;background:transparent;padding:.85em 1.7em;font-weight:600;font-size:.85rem;letter-spacing:.2em;text-transform:uppercase;transition:background .25s,border-color .25s}
.btn:hover{background:var(--r);border-color:var(--r)}
/* portada */
#gate{position:fixed;inset:0;background:var(--k);z-index:30;transition:opacity .4s}
#gate.out{opacity:0;pointer-events:none}
#bg{position:absolute;inset:0;background:#050505 center/cover no-repeat;filter:grayscale(1) contrast(1.1) brightness(.55)}
#c{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:grab;display:block}
#fl{position:absolute;inset:0;background:var(--r);opacity:0;pointer-events:none}
.gt{position:absolute;left:0;right:0;text-align:center;pointer-events:none;padding:0 16px}
.gt.a{top:calc(env(safe-area-inset-top,0px) + 22px);font:400 1.1rem 'Anton',sans-serif;letter-spacing:.3em;text-transform:uppercase}
.gt.b{bottom:calc(env(safe-area-inset-bottom,0px) + 22px);display:flex;flex-direction:column;align-items:center;gap:16px}
.gt.b small{color:var(--m);letter-spacing:.28em;font-size:.72rem;text-transform:uppercase}
.gt .btn{pointer-events:auto}
.lema{font-size:1rem;line-height:1.5;text-transform:uppercase;letter-spacing:.32em!important;padding-left:.32em;color:#fff;animation:lema 1.4s .5s var(--ez) both}
.lema::before{content:"";display:block;width:44px;height:2px;background:var(--r);margin:0 auto 18px}
@keyframes lema{from{opacity:0;transform:translateY(12px);filter:blur(8px)}}
.btn.sr:not(:focus){position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);padding:0;border:0}
#fb{position:absolute;inset:0;display:none;place-items:center;cursor:pointer}
#fb img{width:min(70vw,420px)}
/* app */
#app{display:none}#app.on{display:block}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px clamp(16px,4vw,48px);background:var(--k);border-bottom:1px solid var(--g)}
.bar a.brand{display:flex;align-items:center;gap:12px;font:400 1.15rem 'Anton',sans-serif;text-transform:uppercase;letter-spacing:.08em}
.bar img{width:38px;height:38px}
.bar nav{display:flex;gap:6px}
.bar nav a{padding:.5em .9em;font-weight:600;font-size:.9rem;border-bottom:2px solid transparent}
.bar nav a:hover{border-color:var(--r)}
.intro{display:flex;align-items:center;gap:clamp(14px,3vw,32px);padding:clamp(18px,3vw,36px) clamp(16px,4vw,48px);border-bottom:1px solid var(--g)}
.intro img{width:clamp(64px,9vw,104px)}
.intro h1{font-size:clamp(2rem,5vw,3.6rem)}
.intro p{color:var(--m)}
.idx{display:grid;grid-template-columns:repeat(12,1fr);gap:2px;background:var(--g)}
.tile{position:relative;overflow:hidden;background:var(--k2);padding:clamp(20px,3vw,40px);display:flex;flex-direction:column;justify-content:flex-end;min-height:240px;isolation:isolate;transition:background .35s;animation:rise .7s cubic-bezier(.2,.7,.2,1) both}
.tile:hover,.tile:focus-visible{background:var(--rd)}
.t1{grid-column:span 7;grid-row:span 2;min-height:420px}.t2,.t3{grid-column:span 5}.t4,.t5{grid-column:span 6}
.tile h2{font-size:clamp(1.9rem,3.6vw,3.2rem);max-width:12ch}
.t1 h2{font-size:clamp(2.6rem,6vw,5rem)}
.tile p{color:#cfcfcf;max-width:34ch;margin:.6em 0 1em}
.go{align-self:flex-start;font-weight:600;font-size:.85rem;letter-spacing:.2em;text-transform:uppercase;padding-bottom:6px;border-bottom:2px solid var(--r);transition:padding .3s,border-color .3s}
.tile:hover .go{padding-right:2.5em;border-color:#fff}
.art{position:absolute;z-index:-1;right:-2%;top:2%;width:62%;max-height:70%;color:var(--r);opacity:.28;transition:transform .6s cubic-bezier(.2,.7,.2,1),opacity .4s;font:400 clamp(7rem,16vw,15rem)/.8 'Anton',sans-serif;text-align:right;-webkit-text-stroke:2px var(--r);-webkit-text-fill-color:transparent}
.art svg{width:100%;height:100%;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linejoin:round}
.tile:hover .art{transform:scale(1.08) translate(-2%,2%);opacity:.5}
@keyframes rise{from{opacity:0;transform:translateY(30px)}}
@media(max-width:800px){.tile,.t1,.t2,.t3,.t4,.t5{grid-column:span 12;grid-row:auto;min-height:200px}.t1{min-height:300px}.bar nav a.x{display:none}}
/* vistas */
.wrap{max-width:1180px;margin:auto;padding:clamp(20px,4vw,56px) clamp(16px,4vw,48px) 80px}
.bk{display:inline-block;color:var(--m);font-weight:600;margin-bottom:22px;border-bottom:1px solid transparent}.bk:hover{color:#fff;border-color:var(--r)}
.hd{border-left:6px solid var(--r);padding-left:clamp(14px,2vw,26px);margin:6px 0 clamp(28px,5vw,56px)}
.hd h1{font-size:clamp(2.6rem,8vw,6rem)}.hd p{color:var(--m);max-width:56ch;margin-top:.8em}
.sec{margin-top:clamp(36px,6vw,72px)}
.sec>h2{font-size:clamp(1.6rem,3.5vw,2.4rem);padding-bottom:12px;border-bottom:1px solid var(--g);margin-bottom:22px}
.ph{border:1px dashed #4a4a4a;color:var(--m);padding:24px;text-align:center;display:grid;place-items:center;min-height:120px;background:var(--k2)}
.pd{color:var(--m);font-style:italic}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:2px;background:var(--g)}
.facts div{background:var(--k2);padding:20px}
.facts dt{font-weight:600;color:var(--r);margin-bottom:6px}
.pm{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:clamp(18px,3vw,40px);align-items:start}
.pm figure{position:relative;border:10px solid #e9e4da;background:#1a1a1a;aspect-ratio:4/3;display:grid;place-items:center}
.pm figure img{width:100%;height:100%;object-fit:cover;filter:grayscale(1) contrast(1.1)}
.pm figcaption{position:absolute;left:0;right:0;bottom:-46px;color:var(--m);font-size:.9rem}
@media(max-width:800px){.pm{grid-template-columns:1fr}.pm figure{margin-bottom:46px}}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:2px;background:var(--g)}
.pc{background:var(--k2);display:block;transition:background .3s}.pc:hover{background:var(--rd)}
.pc img,.pc .ph{width:100%;aspect-ratio:3/4;object-fit:cover;min-height:0}
.pc b{display:block;padding:14px 16px 0;font:400 1.4rem 'Anton',sans-serif;text-transform:uppercase}.pc span{display:block;padding:0 16px 16px;color:var(--m)}
.sc{overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:620px}
th{text-align:left;color:var(--m);font-weight:600;font-size:.85rem;padding:10px 12px;border-bottom:2px solid var(--r);white-space:nowrap}
td{padding:14px 12px;border-bottom:1px solid var(--g)}
tr.mr{cursor:pointer}tr.mr:hover td{background:var(--k2)}
tr.dt td{background:var(--k2);color:#ddd}
.tr{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px 20px;align-items:center;padding:clamp(18px,3vw,30px) 0;border-bottom:1px solid var(--g);transition:padding .3s,background .3s}
.tr:hover{padding-left:16px;background:var(--k2)}
.tr h2{font-size:clamp(2.4rem,7vw,5rem)}.tr small{color:var(--m);display:block;margin-top:8px}
.tr .go{white-space:nowrap}
.bl{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:2px;background:var(--g);margin:14px 0}
.bl div{background:var(--k2);padding:18px}.bl b{display:block;font:400 2.4rem 'Anton',sans-serif}.bl span{color:var(--m);font-size:.9rem}
.ctl{display:flex;gap:10px;flex-wrap:wrap;margin:0 0 16px}
.ctl select,.ctl button{background:var(--k2);border:1px solid var(--g);color:#fff;padding:.55em 1em;font:inherit}
.nv{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-top:56px;padding-top:20px;border-top:1px solid var(--g)}
.cg{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
.ci{background:none;border:0;text-align:left;display:block}.ci img{width:100%;aspect-ratio:3/4;object-fit:cover;background:var(--k2)}
.ci span{display:block;padding-top:8px;font-weight:600}.ci:hover img{outline:2px solid var(--r)}
#lb{position:fixed;inset:0;z-index:40;background:rgba(5,5,5,.96);display:none;overflow:auto;padding:clamp(16px,4vw,48px)}
#lb.on{display:block}
.lbi{max-width:1000px;margin:auto;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:28px;animation:rise .45s both}
.lbi img{width:100%;background:var(--k2)}
@media(max-width:800px){.lbi{grid-template-columns:1fr}}
.prof{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr);gap:clamp(20px,4vw,52px)}
.prof>img,.prof>.ph{width:100%;aspect-ratio:3/4;object-fit:cover}
.prof h1{font-size:clamp(2.6rem,7vw,5rem)}
@media(max-width:800px){.prof{grid-template-columns:1fr}}
#cur{position:fixed;inset:0;z-index:50;background:var(--r);pointer-events:none;display:grid;place-items:center;transform:translateX(-101%)}
#cur span{font:400 clamp(2.4rem,10vw,7rem)/1 'Anton',sans-serif;text-transform:uppercase;text-align:center;padding:0 16px;color:var(--k)}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

:root{--ez:cubic-bezier(.32,.72,0,1)}
*{font-family:'Manrope',system-ui,sans-serif!important}
h1,h2,h3,.d,.pc b,.bl b,.bar a.brand,#cur span,.art{font-weight:700!important;font-style:normal!important;letter-spacing:-.02em}
h1,h2,h3{text-wrap:balance}p{text-wrap:pretty}
.lema{font-weight:600!important}
#c{animation:cin 1.6s var(--ez) both}@keyframes cin{from{opacity:0;transform:scale(.94)}}
.tile,.pc,.tr,.btn,.ci,.go{transition-timing-function:var(--ez)}
.tile{transition-duration:.35s}.tile .art{transition-duration:.7s}
.tile:active,.pc:active,.tr:active,.btn:active,.ci:active{transform:scale(.98);transition-duration:.12s}
.rv{opacity:0;transform:translateY(40px);filter:blur(8px);transition:opacity .9s var(--ez),transform .9s var(--ez),filter .9s var(--ez)}
.rv.in{opacity:1;transform:none;filter:none}
.tag{padding:clamp(72px,14vw,160px) clamp(16px,4vw,48px);background:var(--k);border-top:1px solid var(--g)}
.tag p{max-width:880px;margin:auto;font-size:2.25rem;line-height:1.15;font-weight:700}
@media(min-width:800px){.tag p{font-size:3.75rem;line-height:1.05}}
.tag .w{color:rgba(255,255,255,.28);transition:color .7s var(--ez)}.tag .w.on{color:#fff}.tag .w.r.on{color:var(--r)}
.skip{position:absolute;left:-999px;top:8px;z-index:60;background:var(--r);padding:8px 12px;border:0;font-weight:600}.skip:focus{left:8px}
#main:focus{outline:0}
.nf{min-height:60vh;display:grid;place-content:center;justify-items:center;text-align:center;gap:16px}.nf img{width:96px}
.pj{position:relative;overflow:hidden;padding:24px;min-height:200px;display:flex;flex-direction:column;justify-content:flex-end;isolation:isolate}
.pj .n{position:absolute;right:14px;top:-4px;padding:0;font-size:7.5rem;line-height:1;font-weight:700;color:transparent;-webkit-text-stroke:1px var(--r);opacity:.55;z-index:-1;transition:transform .5s var(--ez)}
.pj b{padding:0;font-size:1.5rem;line-height:1.15}
.pj small{display:block;margin-top:8px;color:var(--m);font-weight:600;font-size:.875rem;letter-spacing:.08em;transition:color .3s}
.pj img{position:absolute;inset:0;width:100%;height:100%;aspect-ratio:auto;object-fit:cover;z-index:-2}
@media(hover:hover) and (pointer:fine){.pj:hover .n{transform:translateY(8px) scale(1.06)}.pj:hover small{color:#fff}}
.cl{min-width:560px}.cl td,.cl th{font-variant-numeric:tabular-nums}.cl .eq{display:flex;align-items:center;gap:12px;font-weight:600}
.cl th:last-child{color:var(--r)}.cl tr.me td{background:var(--k2)}.cl tr.me .eq{color:var(--r)}
.nt{color:var(--m);font-size:.875rem;margin-top:16px;max-width:60ch}
.ft{display:flex;gap:16px;flex-wrap:wrap;padding:24px clamp(16px,4vw,48px);border-top:1px solid var(--g);color:var(--m);font-size:.75rem;letter-spacing:.08em;text-transform:uppercase}
.ft a{color:#fff;border-bottom:1px solid var(--r)}
.t6{grid-column:span 12;min-height:200px}
.jt{width:100%;display:flex;align-items:center;gap:16px;text-align:left;background:var(--k2);border:1px solid var(--g);padding:24px;transition:background .3s var(--ez),transform .12s}
.jt span{font-size:clamp(1.75rem,5vw,3rem);font-weight:700;text-transform:uppercase;letter-spacing:-.02em;line-height:1}
.jt small,.jh small{color:var(--m);font-weight:600;margin-left:auto}
@media(hover:hover) and (pointer:fine){.jt:hover,.jh:hover{background:var(--rd)}}
.jt:active,.jh:active{transform:scale(.99)}
.jt i,.jh i{width:10px;height:10px;border-right:2px solid var(--r);border-bottom:2px solid var(--r);transform:rotate(45deg);transition:transform .4s var(--ez),margin .4s var(--ez);flex:none;margin-top:-4px}
[aria-expanded=true]>i{transform:rotate(225deg);margin-top:4px}
.cp{display:grid;grid-template-rows:0fr;transition:grid-template-rows .4s var(--ez)}.cp.open{grid-template-rows:1fr}.cp>div{overflow:hidden;min-height:0}.cp:not(.open)>div{visibility:hidden}
.jlist{border:1px solid var(--g);border-top:0}
.jh{width:100%;display:flex;align-items:center;gap:16px;padding:16px 24px;background:var(--k);border:0;border-bottom:1px solid var(--g);text-align:left;transition:background .3s var(--ez),transform .12s}.jh b{font-size:1.125rem}
.jp{list-style:none;padding:0;background:var(--k2)}
.jm{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px;padding:14px 24px;border-bottom:1px solid var(--g)}
.cp.open .jm{animation:jin .45s var(--ez) both;animation-delay:calc(var(--i,0)*45ms)}
@keyframes jin{from{opacity:0;transform:translateY(8px)}}
.tc{display:flex;align-items:center;gap:10px;font-weight:600}.tc.l{justify-content:flex-end;text-align:right}.tc img{flex:none}.tc.me{color:var(--r)}
.sc2{min-width:48px;text-align:center;color:var(--m);font-weight:700;font-variant-numeric:tabular-nums}
.ds{padding:14px 24px;color:var(--m);font-size:.875rem}
@media(max-width:560px){.jt,.jh{padding:16px}.jm,.ds{padding:12px 16px}.tc{font-size:.875rem;gap:6px}.jt small{display:none}}
a.jh{color:inherit}a.jh i{transform:rotate(-45deg);margin-top:0}
@media(hover:hover) and (pointer:fine){a.jh:hover i{transform:rotate(-45deg) translate(3px,3px)}}
.jp.big{border:1px solid var(--g);border-bottom:0}
.jp.big .jm{padding:22px 24px;animation:jin .5s var(--ez) both;animation-delay:calc(var(--i,0)*60ms)}
.jp.big .tc{font-size:1.125rem}.jp.big .sc2{font-size:1.25rem}
@media(max-width:560px){.jp.big .jm{padding:16px}.jp.big .tc{font-size:.875rem}}
</style>
</head>
<body>
<button class="skip" onclick="document.getElementById('main').focus()">Saltar al contenido</button>
<div id="gate">
  <div id="bg"></div>
  <canvas id="c" aria-label="Escudo de Pizza United FC en 3D. Arrástralo para girarlo y púlsalo para entrar."></canvas>
  <div id="fb"><img class="crest" alt="Escudo de Pizza United FC"></div>
  <div id="fl"></div>
  <div class="gt b"><p class="lema">L’equip del poble</p><button class="btn sr" id="enter">Entrar al club</button></div>
</div>
<div id="app">
  <header class="bar"><a class="brand" href="#/"><img class="crest" alt="">Pizza United FC</a>
  <nav><a class="x" href="#/">Índice</a><a href="#/portada">Portada</a></nav></header>
  <main id="main" tabindex="-1"></main>
  <footer class="ft" id="redes"></footer>
</div>
<div id="lb" role="dialog" aria-modal="true" aria-label="Detalle de camiseta"></div>

const pcard=p=>`<a class="pc pj" href="#/jugadores/${E(p.id)}">${p.foto?img(p.foto,p.nombre):""}<span class="n" aria-hidden="true">${E(p.dorsal??"")}</span><b>${P(p.nombre)}</b><small>${p.dorsal!=null?E(p.dorsal)+" · ":""}${P(p.posicion)}${p.apodo?" · «"+E(p.apodo)+"»":""}</small></a>`;
function jug(){const a=orden(DATA.jugadores),r=DATA.retirados;
return `<div class="wrap">${back("#/","Índice")}${head(T.jugadores,"Plantilla actual y jugadores retirados.")}<section class="sec" style="margin-top:0"><h2>Plantilla actual</h2><div class="cards">${a.length?a.map(pcard).join(""):`<div class="pc">${ph("Foto pendiente")}<b>Ficha pendiente</b><span>Nombre, apodo, dorsal, posición, temporadas, partidos y goles.</span></div>`}</div></section>
<section class="sec"><h2>Jugadores retirados</h2>${r.length?`<div class="sc"><table><thead><tr><th>Nombre</th><th>Apodo</th><th>Posición</th><th>Temporadas</th><th>PJ</th><th>Goles</th><th>Retirada</th></tr></thead><tbody>${r.map(p=>`<tr><td><a href="#/jugadores/${E(p.id)}"><b>${P(p.nombre)}</b></a></td><td>${P(p.apodo)}</td><td>${P(p.posicion)}</td><td>${P(p.temporadas)}</td><td>${P(p.pj)}</td><td>${P(p.goles)}</td><td>${P(p.anioRetirada)}</td></tr>`).join("")}</tbody></table></div>`:ph("Todavía no hay jugadores retirados registrados.")}</section></div>`}
function perfil(id){const L=DATA.jugadores.some(p=>p.id===id)?orden(DATA.jugadores):DATA.retirados,i=L.findIndex(p=>p.id===id),p=L[i];if(!p)return `<div class="wrap">${back("#/jugadores","Jugadores")}${head("Jugador no encontrado")}</div>`;
const les=DATA.lesiones.filter(l=>l.jugador===id&&l.publicable===true),h=p.historia||{};
return `<div class="wrap">${back("#/jugadores","Volver a jugadores")}<div class="prof">${p.foto?img(p.foto,p.nombre):ph("Fotografía pendiente")}<div><h1>${P(p.nombre)}</h1><p>${p.apodo?"«"+E(p.apodo)+"» · ":""}${p.dorsal!=null?"Dorsal "+E(p.dorsal)+" · ":""}${P(p.posicion)}</p><p>Temporadas en el club: ${P(p.temporadas)}</p>${blocks([[p.pj??"—","Partidos"],[p.goles??"—","Goles"]].concat(Object.entries(p.otros||{}).map(([k,v])=>[E(v),E(k)])))}</div></div>
<section class="sec"><h2>Historial de lesiones</h2>${les.length?les.map(l=>`<p><b>${P(l.fecha)}</b> · ${P(l.descripcion)}${l.baja?" · Baja: "+E(l.baja):""}</p>`).join(""):ph("No hay datos registrados.")}</section>
<section class="sec"><h2>Historia en el club</h2><p><b>Momentos destacados:</b> ${P(h.momentos)}</p><p><b>Partidos memorables:</b> ${P(h.partidos)}</p><p><b>Reconocimientos:</b> ${P(h.reconocimientos)}</p></section>
<div class="nv">${i>0?`<a class="btn" href="#/jugadores/${E(L[i-1].id)}">Anterior</a>`:"<span></span>"}<a class="btn" href="#/">Índice</a>${i<L.length-1?`<a class="btn" href="#/jugadores/${E(L[i+1].id)}">Siguiente</a>`:"<span></span>"}</div></div>`}
function palm(){const t=DATA.trofeos,f=t.filter(x=>x.destacado),o=t.filter(x=>!x.destacado).sort((a,b)=>String(b.temporada).localeCompare(String(a.temporada)));
const row=x=>`<div class="tr"><div><h2>${P(x.competicion)}</h2><small>${P(x.temporada)} · ${P(x.descripcion)}</small></div>${x.foto?img(x.foto,"Trofeo").replace("<img",'<img width="120"'):""}</div>`;
return `<div class="wrap">${back("#/","Índice")}${head(T.palmares,"Los títulos y reconocimientos ganados por el club.")}${t.length?f.map(row).join("")+(o.length?`<section class="sec"><h2>Cronología</h2>${o.map(row).join("")}</section>`:""):ph("El palmarés está pendiente de completar. Cada trofeo se añade en la lista «trofeos» de los datos.")}</div>`}

const tm=id=>DATA.liga.equipos.find(e=>e.id===id)||{nombre:id};
const ci=id=>{const s=tm(id).escudo;return s?`<img src="${E(s)}" alt="" width="24" height="24">`:""};
const msOf=id=>{const r=DATA.partidos.filter(m=>m.temporada===id);if(id===DATA.liga.temporada)DATA.liga.jornadas.forEach(j=>j.partidos.forEach(m=>{const h=m.local==="pizza-united",a=m.visitante==="pizza-united";if(!h&&!a)return;const ok=Number.isFinite(m.gl)&&Number.isFinite(m.gv);r.push({id:"j"+j.n,temporada:id,jornada:j.n,fecha:j.fecha,rival:tm(h?m.visitante:m.local).nombre,local:h,gf:ok?(h?m.gl:m.gv):null,gc:ok?(h?m.gv:m.gl):null,estado:ok?"Jugado":"Programado"})}));return r};
const mrow=(m,i)=>{const ok=Number.isFinite(m.gl)&&Number.isFinite(m.gv),me=x=>x==="pizza-united"?" me":"";
 return `<li class="jm" style="--i:${i}"><span class="tc l${me(m.local)}">${E(tm(m.local).nombre)}${ci(m.local)}</span><span class="sc2">${ok?m.gl+" - "+m.gv:"vs"}</span><span class="tc${me(m.visitante)}">${ci(m.visitante)}${E(tm(m.visitante).nombre)}</span></li>`};
function jornadas(id){const J=DATA.liga.jornadas;if(id!==DATA.liga.temporada||!J.length)return"";
 return `<section class="sec" style="margin-top:0"><button class="jt" aria-expanded="false" aria-controls="jl"><span>Jornadas</span><small>${J.length} jornadas · ${J.reduce((a,j)=>a+j.partidos.length,0)} partidos</small><i aria-hidden="true"></i></button><div class="cp" id="jl"><div><div class="jlist">${J.map(j=>`<a class="jh" href="#/temporadas/${id}/jornada/${j.n}"><b>Jornada ${j.n}</b><small>${j.fecha?E(j.fecha):"Fecha por confirmar"}</small><i aria-hidden="true"></i></a>`).join("")}</div></div></div></section>`}
function jor(id,n){const J=DATA.liga.jornadas,j=J.find(x=>x.n===n);
 if(id!==DATA.liga.temporada||!j)return `<div class="wrap">${back("#/temporadas/"+id,"Temporada "+id)}${head("Jornada no encontrada")}</div>`;
 const i=J.indexOf(j),L=k=>`#/temporadas/${id}/jornada/${J[k].n}`;
 return `<div class="wrap">${back("#/temporadas/"+id,"Temporada "+id)}${head("Jornada "+j.n,id+" · "+(j.fecha?E(j.fecha):"Fecha por confirmar"))}<ul class="jp big">${j.partidos.map(mrow).join("")}${j.descansa?`<li class="ds">Descansa: ${E(tm(j.descansa).nombre)}</li>`:""}</ul>
<div class="nv">${i>0?`<a class="btn" href="${L(i-1)}">Jornada ${J[i-1].n}</a>`:"<span></span>"}<a class="btn" href="#/temporadas/${id}">Todas las jornadas</a>${i<J.length-1?`<a class="btn" href="${L(i+1)}">Jornada ${J[i+1].n}</a>`:"<span></span>"}</div></div>`}
const POS=["POR","DFC","MI","MC","MD","MCD","MCO","DC"],pi=x=>{const i=POS.indexOf(x);return i<0?99:i};
const orden=l=>l.slice().sort((a,b)=>pi(a.posicion)-pi(b.posicion)||(a.dorsal??99)-(b.dorsal??99));
function tabla(){const L=DATA.liga,t={};L.equipos.forEach(e=>t[e.id]={...e,pj:0,g:0,e:0,p:0,gf:0,gc:0,pts:0});
 L.jornadas.flatMap(j=>j.partidos).forEach(m=>{const a=t[m.local],b=t[m.visitante];if(!a||!b||!Number.isFinite(m.gl)||!Number.isFinite(m.gv))return;
  a.pj++;b.pj++;a.gf+=m.gl;a.gc+=m.gv;b.gf+=m.gv;b.gc+=m.gl;
  if(m.gl>m.gv){a.g++;b.p++;a.pts+=3}else if(m.gl<m.gv){b.g++;a.p++;b.pts+=3}else{a.e++;b.e++;a.pts++;b.pts++}});
 return Object.values(t).sort((x,y)=>y.pts-x.pts||(y.gf-y.gc)-(x.gf-x.gc)||y.gf-x.gf||x.nombre.localeCompare(y.nombre,"es"))}
function clasif(){const t=tabla(),any=DATA.liga.jornadas.some(j=>j.partidos.some(m=>Number.isFinite(m.gl)));
return `<div class="wrap">${back("#/","Índice")}${head(T.clasificacion,DATA.liga.nombre+". Victoria 3 puntos, empate 1 punto y derrota 0.")}
<div class="sc"><table class="cl"><thead><tr><th>Pos</th><th>Equipo</th><th>PJ</th><th>G</th><th>E</th><th>P</th><th>GF</th><th>GC</th><th>DG</th><th>Pts</th></tr></thead><tbody>${t.map((e,i)=>{const src=e.escudo;return `<tr class="${e.id==="pizza-united"?"me":""}"><td>${i+1}</td><td><span class="eq">${src?`<img src="${E(src)}" alt="" width="28" height="28">`:""}${E(e.nombre)}</span></td><td>${e.pj}</td><td>${e.g}</td><td>${e.e}</td><td>${e.p}</td><td>${e.gf}</td><td>${e.gc}</td><td>${e.gf-e.gc}</td><td><b>${e.pts}</b></td></tr>`}).join("")}</tbody></table></div>
<p class="nt">${any?"":"Todavía no hay resultados registrados, por eso todos los equipos parten con 0 puntos. "}Desempate por diferencia de goles y después por goles a favor.</p></div>`}
const nf=()=>`<div class="wrap nf"><img class="crest" alt="Escudo de Pizza United FC"><h1>Página no encontrada</h1><p class="pd">Esta dirección no existe en el archivo del club.</p><a class="btn" href="#/">Volver al índice</a></div>`;
function reveal(m){if(!("IntersectionObserver" in window))return;
 const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add("in");const el=e.target;setTimeout(()=>el.style.transitionDelay="",1300);io.unobserve(el)}}),{rootMargin:"0px 0px -8% 0px"});
 m.querySelectorAll(".hd,.sec>h2,.facts,.pm,.bl,.nv,.sc,.ph,.prof>*,.tr,.cards>*,.cg>*").forEach(x=>{x.classList.add("rv");x.style.transitionDelay=Math.min([...x.parentNode.children].indexOf(x),8)*45+"ms";io.observe(x)});
 const tg=m.querySelector("#tg");if(tg){tg.innerHTML=tg.textContent.trim().split(/\s+/).map((t,i)=>`<span class="w${i<3?" r":""}">${t}</span>`).join(" ");
  const wo=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add("on");wo.unobserve(e.target)}}),{rootMargin:"0px 0px -35% 0px"});
  tg.querySelectorAll(".w").forEach(w=>wo.observe(w))}}
/* ---------- enrutado y transiciones ---------- */
const isGate=()=>["","#","#/portada"].includes(location.hash);
const route=()=>{const [s,...r]=location.hash.replace(/^#\/?/,"").split("/").map(decodeURIComponent);return{s:s||"",r}};
function render(){const{s,r}=route(),m=$("#main");let h;
 h=s==="historia"?historia():s==="temporadas"?(r[0]?(r[1]==="jornada"?jor(r[0],+r[2]):temp(r[0])):temps()):s==="camisetas"?camisetas():s==="jugadores"?(r[0]?perfil(r[0]):jug()):s==="palmares"?palm():s==="clasificacion"?clasif():s===""?home():nf();
 m.innerHTML=h;reveal(m);m.querySelectorAll("img.crest").forEach(i=>i.src=CREST);document.title=(T[s]?T[s]+" · ":"")+"Pizza United FC"}
let lastJ=null;const D={fwd:"100%,0%",back:"-100%,0%","":"0%,100%",historia:"-100%,0%",temporadas:"100%,0%",camisetas:"0%,-100%",jugadores:"100%,0%",palmares:"0%,100%"};
const neg=v=>v==="0%"?v:v[0]==="-"?v.slice(1):"-"+v;
async function swap(fn,label,s){if(RM||!$("#cur").animate){fn();scrollTo(0,0);return}
 const c=$("#cur"),[x,y]=(D[s]||D.historia).split(",");c.firstChild.textContent=label;
 await c.animate([{transform:`translate(${x},${y})`},{transform:"none"}],{duration:320,easing:"cubic-bezier(.7,0,.2,1)",fill:"forwards"}).finished;
 fn();scrollTo(0,0);
 await c.animate([{transform:"none"},{transform:`translate(${neg(x)},${neg(y)})`}],{duration:380,easing:"cubic-bezier(.7,0,.2,1)",fill:"forwards"}).finished}
let q=Promise.resolve(),skip=false;
addEventListener("hashchange",()=>{if(skip){skip=false;return}
 $("#lb").classList.remove("on");const{s,r}=route(),nj=r[1]==="jornada"?+r[2]:null;let dir=s;if(nj!=null&&lastJ!=null)dir=nj>lastJ?"fwd":"back";lastJ=nj;
 q=q.then(()=>swap(()=>{if(isGate())showGate();else{$("#gate").classList.add("out");stop();$("#app").classList.add("on");render()}},(r[1]==="jornada"?"Jornada "+r[2]:r[0])||T[s]||"Pizza United FC",dir))});

/* ---------- escudo 3D ---------- */
const gate=$("#gate"),cv=$("#c"),N=14,AUTO=RM?0:.004;
let ren,sc,cam,grp,lay=[],raf=0,state="idle",ry=0,rx=0,vel=AUTO,drag=null,down=null,bz=7.5,ent=0,fired=false,sry=0,tgt=0;
const cl=(v,a=0,b=1)=>Math.min(b,Math.max(a,v)),ez=t=>t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2,lp=(a,b,t)=>a+(b-a)*t;
function fit(){if(!ren)return;const w=cv.clientWidth,h=cv.clientHeight;ren.setSize(w,h,false);cam.aspect=w/h;bz=Math.max(8,6.8/(w/h));if(state==="idle")cam.position.z=bz;cam.updateProjectionMatrix()}
function init3(){
 if(typeof THREE==="undefined"){return fb()}
 try{ren=new THREE.WebGLRenderer({canvas:cv,antialias:true,alpha:true})}catch(e){return fb()}
 ren.setPixelRatio(Math.min(devicePixelRatio,2));ren.outputEncoding=THREE.sRGBEncoding;
 sc=new THREE.Scene();cam=new THREE.PerspectiveCamera(32,1,.1,50);
 sc.add(new THREE.AmbientLight(0xffffff,.5));
 const k=new THREE.DirectionalLight(0xffffff,.55);k.position.set(-3,4,6);sc.add(k);const k2=new THREE.DirectionalLight(0xffffff,.55);k2.position.set(3,3,-6);sc.add(k2);
 const r=new THREE.PointLight(0xE50914,1.3,16);r.position.set(3.5,-1.5,-2.5);sc.add(r);
 const r2=new THREE.PointLight(0xE50914,.35,14);r2.position.set(-3,-2,4);sc.add(r2);
 new THREE.TextureLoader().load(CREST,t=>{t.encoding=THREE.sRGBEncoding;t.anisotropy=8;
  grp=new THREE.Group();const g=new THREE.PlaneGeometry(3.1,3.1),M=9,D=.14;
  for(let i=0;i<M;i++){const f=i===0||i===M-1,m=new THREE.MeshStandardMaterial({map:t,alphaTest:.5,roughness:.5,metalness:.1,color:f?0xffffff:0x2b1209,side:f?THREE.FrontSide:THREE.DoubleSide}),p=new THREE.Mesh(g,m);p.position.z=-D/2+D*i/(M-1);if(i===0)p.rotation.y=Math.PI;grp.add(p)}
  sc.add(grp);fit();if(isGate())showGate()},undefined,fb);
 addEventListener("resize",fit)}
function fb(){$("#fb").style.display="grid";$("#fb img").src=CREST;$("#fb").onclick=enter;cv.style.display="none"}
function loop(ts){raf=requestAnimationFrame(loop);const t=ts/1000;
 if(state==="idle"){if(!drag){vel+=(AUTO-vel)*.025;ry+=vel;rx+=(0-rx)*.04}}
 else if(state==="enter"){const p=(performance.now()-ent)/2000,e=ez(cl(p/.35)),qq=Math.pow(cl((p-.1)/.9),2.4);
  ry=lp(sry,tgt,e);rx*=.9;const s=1-.06*Math.sin(cl(p/.2)*Math.PI);grp.scale.setScalar(s);
  cam.position.z=lp(bz,1.5,qq);
  if(p>.8&&!fired){fired=true;done()}}
 grp.rotation.set(rx,ry,0);grp.position.y=Math.sin(t*1.2)*.06;ren.render(sc,cam)}
function done(){skip=true;location.hash="#/";gate.classList.add("out");$("#app").classList.add("on");render();scrollTo(0,0);setTimeout(stop,800)}
function stop(){if(raf){cancelAnimationFrame(raf);raf=0}}
function showGate(){gate.classList.remove("out");$("#app").classList.remove("on");if(!grp)return;state="idle";fired=false;ry=0;rx=0;vel=AUTO;cam.position.z=bz;grp.scale.setScalar(1);if(!raf)raf=requestAnimationFrame(loop)}
function enter(){if(state==="enter")return;if(!grp||RM){done();return}state="enter";ent=performance.now();sry=ry;tgt=Math.round(ry/(2*Math.PI))*2*Math.PI}
cv.addEventListener("pointerdown",e=>{cv.setPointerCapture(e.pointerId);drag={x:e.clientX,y:e.clientY};down={x:e.clientX,y:e.clientY,t:performance.now()};cv.style.cursor="grabbing"});
cv.addEventListener("pointermove",e=>{if(!drag||state!=="idle")return;const dx=e.clientX-drag.x,dy=e.clientY-drag.y;drag={x:e.clientX,y:e.clientY};ry+=dx*.009;rx=cl(rx+dy*.006,-.6,.6);vel+=(dx*.009-vel)*.5});
cv.addEventListener("pointerup",e=>{cv.style.cursor="grab";const wasDrag=drag;drag=null;if(!down||!wasDrag)return;
 const r=cv.getBoundingClientRect(),d=Math.hypot(e.clientX-down.x,e.clientY-down.y),c=Math.hypot(e.clientX-r.left-r.width/2,e.clientY-r.top-r.height/2);
 if(d<8&&performance.now()-down.t<600&&c<Math.min(r.width,r.height)*.33)enter();down=null});
cv.addEventListener("pointercancel",()=>{drag=null;down=null});
$("#enter").onclick=enter;

/* ---------- eventos de la interfaz ---------- */
document.addEventListener("click",e=>{const t=e.target.closest(".jt");if(t){const o=t.nextElementSibling.classList.toggle("open");t.setAttribute("aria-expanded",o)}
 const m=e.target.closest(".mr");if(m){const d=document.getElementById("d-"+m.dataset.m);if(d)d.hidden=!d.hidden}
 const c=e.target.closest("[data-c]");if(c)lb(c.dataset.c);
 if(e.target.id==="lx")$("#lb").classList.remove("on");
 if(e.target.id==="ord"){ord=ord==="asc"?"desc":"asc";e.target.textContent="Orden por fecha: "+(ord==="asc"?"ascendente":"descendente");const t=$("#tb");t.innerHTML=tbl(t.dataset.s)}});
document.addEventListener("change",e=>{if(e.target.id==="flt"){flt=e.target.value;const t=$("#tb");t.innerHTML=tbl(t.dataset.s)}});
document.addEventListener("keydown",e=>{if(e.key==="Escape")$("#lb").classList.remove("on");
 if(e.key==="Enter"&&e.target.classList?.contains("mr"))e.target.click();
 if($("#lb").classList.contains("on")&&(e.key==="ArrowRight"||e.key==="ArrowLeft")){const b=document.querySelectorAll("#lb [data-c]");(e.key==="ArrowLeft"?b[0]:b[1])?.click()}});
$("#redes").innerHTML=DATA.club.instagram?`<span>Redes</span><a href="${E(DATA.club.instagram)}" target="_blank" rel="noopener">Instagram</a>`:`<span>Redes</span><span>Instagram</span><span class="pd">enlace pendiente</span>`;
if(BG)$("#bg").style.backgroundImage="url("+BG+")";
document.querySelectorAll("img.crest").forEach(i=>i.src=CREST);
if(isGate()){init3()}else{gate.classList.add("out");$("#app").classList.add("on");render();init3();stop()}
</script>
</body>
</html>
